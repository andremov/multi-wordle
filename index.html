<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- the saved theme, stamped before first paint (@andremov/brand/theme-script) -->
    <script>try{var t=localStorage.getItem("andremov-theme");if(t==="time"){var h=new Date().getHours();t=h>=19||h<7?"dark":"light"}if(t==="light"||t==="dark"){var r=document.documentElement;r.classList.remove("light","dark");r.classList.add(t);r.dataset.theme=t}}catch(e){}</script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Play 100 Wordles at once — a new daily puzzle every day." />
    <title>hundredle</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
